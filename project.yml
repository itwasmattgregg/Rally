# Optional: generate the Xcode project with XcodeGen (`brew install xcodegen && xcodegen`)
name: Rally
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rally:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Shared
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Rally
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rally
        INFOPLIST_KEY_WKWatchOnly: YES
    dependencies:
      - target: RallyWidgetExtension
    entitlements:
      path: RallyWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.Rally

  RallyWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      - path: WidgetExtension
      - path: Shared/ScoreDefaults.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Rally.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Score
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RallyWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.Rally

schemes:
  Rally:
    build:
      targets:
        Rally: all
        RallyWidgetExtension: all
    run:
      config: Debug
