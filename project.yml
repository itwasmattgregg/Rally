# Optional: regenerate with XcodeGen (`brew install xcodegen && xcodegen`)
# The checked-in Rally.xcodeproj is the source of truth for day-to-day builds.
name: Rally
options:
  bundleIdPrefix: ItWasMattGregg
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: A6GDPWEW4E
targets:
  Rally:
    type: application
    platform: iOS
    sources:
      - path: RallyContainer
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ItWasMattGregg.Rally
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RallyContainer/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    entitlements:
      path: RallyContainer/RallyCompanion.entitlements
    dependencies:
      - target: Rally Watch App
        embed: true

  Rally Watch App:
    type: application
    platform: watchOS
    sources:
      - path: Rally Watch App
        excludes:
          - ScoreWidget/AppIntent.swift
          - ScoreWidget/Assets.xcassets
          - ScoreWidget/Info.plist
          - ScoreWidget/ScoreWidget.swift
          - ScoreWidget/ScoreWidgetBundle.swift
          - ScoreWidget/ScoreWidgetControl.swift
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ItWasMattGregg.Rally.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rally
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: ItWasMattGregg.Rally
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_WKBackgroundModes: workout-processing
        INFOPLIST_KEY_NSHealthShareUsageDescription: Rally reads your heart rate and active energy during a match.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Rally saves the volleyball workout and final score to Health.
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    entitlements:
      path: Rally Watch App/Rally Watch App.entitlements
    dependencies:
      - target: ScoreWidgetExtension

  ScoreWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      - path: Rally Watch App/ScoreWidget
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ItWasMattGregg.Rally.watchkitapp.ScoreWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Rally Watch App/ScoreWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Score
    entitlements:
      path: Rally Watch App/ScoreWidget/ScoreWidget.entitlements

schemes:
  Rally:
    build:
      targets:
        Rally: all
        Rally Watch App: all
        ScoreWidgetExtension: all
    run:
      config: Debug
